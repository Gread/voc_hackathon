<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice of the Customer Insights</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <strong>Voice of the Customer</strong>
    <span class="sub" id="pipelineStrip">loading…</span>
  </div>
  <div class="sources" id="sources" hidden>
    <span class="sources-label">Data</span>
    <div class="source-boxes" id="sourceBoxes"></div>
  </div>
  <div class="filters" id="filters">
    <label>Product <select id="fProduct" multiple size="1"></select></label>
    <label>Segment <select id="fSegment" multiple size="1"></select></label>
    <label>Region <select id="fRegionGroup" multiple size="1"></select></label>
    <label>From <input type="date" id="fFrom"></label>
    <label>To <input type="date" id="fTo"></label>
    <button id="clearFilters" class="ghost" type="button">Clear</button>
  </div>
  <div class="asof">
    <label for="asOf">As of</label>
    <input type="range" id="asOf" min="0" max="0" value="0">
    <output id="asOfLabel">—</output>
    <button id="replay" class="ghost" type="button" title="Replay the last 16 weeks">▶</button>
  </div>
  <div class="badges">
    <span class="mode" id="modeBadge">…</span>
    <button id="aboutBtn" class="ghost" type="button">About this data</button>
  </div>
</header>

<main>
  <section class="dashboard" id="dashboard">
    <article class="panel" id="panelReasons">
      <h2>What customers contact us about</h2>
      <div class="panel-body" id="reasonsBody"><p class="muted">loading…</p></div>
    </article>

    <article class="panel" id="panelDrivers">
      <h2>
        <span class="tabs">
          <button class="tab active" data-polarity="negative" type="button">Negative drivers</button>
          <button class="tab" data-polarity="positive" type="button">Satisfaction</button>
        </span>
      </h2>
      <div class="panel-body" id="driversBody"><p class="muted">loading…</p></div>
    </article>

    <article class="panel" id="panelEmerging">
      <h2>Emerging now</h2>
      <div class="panel-body" id="emergingBody"><p class="muted">loading…</p></div>
    </article>

    <article class="panel wide" id="panelTrend">
      <h2>Trend <span class="muted" id="trendSubtitle"></span></h2>
      <div class="panel-body"><canvas id="trendChart" height="150"></canvas></div>
    </article>
  </section>

  <section class="ask" id="ask">
    <h2>Ask</h2>
    <form id="askForm">
      <input type="text" id="askInput" placeholder="Ask a question about what customers say…" autocomplete="off">
      <button type="submit" id="askBtn">Ask</button>
    </form>
    <div class="chips" id="questionChips"></div>
    <div id="askOutput" class="ask-output"></div>
  </section>
</main>

<div class="drawer" id="drawer" hidden>
  <div class="drawer-inner">
    <button class="close" id="drawerClose" type="button" aria-label="Close">×</button>
    <div id="drawerBody"></div>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-inner">
    <button class="close" id="modalClose" type="button" aria-label="Close">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="/static/vendor/chart.umd.min.js"></script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
