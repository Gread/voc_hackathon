[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voc-insights"
version = "0.1.0"
description = "Voice of the Customer Insights PoC: agents read every contact, the server verifies every number"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pandas>=2.1",
    "anthropic>=1.5",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
voc = "voc.cli:main"

[tool.setuptools.packages.find]
include = ["voc*"]

[tool.setuptools.package-data]
voc = ["taxonomy/*.json", "extract/*.md", "theme/prompts/*.md", "agent/*.md", "store/*.sql", "web/*", "web/js/*", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
