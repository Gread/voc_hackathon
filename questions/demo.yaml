# The eight questions from the briefing: the acceptance test and the demo chips.
questions:
  - id: q1
    question: "What are customers contacting us about most, and what is changing?"
    aliases:
      - "Top contact reasons"
      - "Why do customers contact us?"
      - "What is rising and what is falling?"
    followups:
      - "Which calls are behind the biggest reason?"
      - "How has that reason moved month by month?"
  - id: q2
    question: "What are the main causes of negative sentiment, and what specifically triggers them?"
    aliases:
      - "What drives dissatisfaction?"
      - "Biggest pain points"
    followups:
      - "Show me the calls behind the top driver"
      - "Does that driver differ by product?"
  - id: q3
    question: "Which experiences create satisfaction, and what should we protect?"
    aliases:
      - "What do customers praise?"
      - "What goes right?"
    followups:
      - "Which quotes show that?"
  - id: q4
    question: "Which issues are growing fastest, and are any of them new?"
    aliases:
      - "What is emerging?"
      - "Any new problems in the last weeks?"
    followups:
      - "How many calls was that based on four weeks ago?"
      - "Is it robust over eight weeks?"
  - id: q5
    question: "Are customers describing the same underlying problem in different ways?"
    aliases:
      - "Same problem, different words"
      - "Which theme has the most wordings?"
    followups:
      - "Show the different wordings"
      - "Which products does it span?"
  - id: q6
    question: "How do pain points differ by product, segment or region?"
    aliases:
      - "Differences by product"
      - "Which segment complains most?"
    followups:
      - "Compare the last three months with the previous three"
  - id: q7
    question: "Which customer statements support that conclusion, and how many calls is it based on?"
    aliases:
      - "What is the evidence?"
      - "How many calls back this up?"
    followups:
      - "Open one of those calls"
  - id: q8
    question: "What did the actual customers say in the calls supporting that conclusion?"
    aliases:
      - "Show me verbatim quotes"
      - "In the customers' own words"
    followups:
      - "Show a full call with the quote highlighted"
